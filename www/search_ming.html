<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>콘텐츠 탐색 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#0F1116; --panel:#171A21; --panel2:#1D212B; --line:#272C38;
  --text:#E9EBF2; --sub:#8B93A7; --faint:#5A6274;
  --amber:#FFC94D; --amber-ink:#1A1403;
  --yt:#FF4B3E; --shorts:#FF8A3D; --insta:#E1489B; --threads:#C9CDD8; --tiktok:#3DE0DC; --naver:#5BE39B;
  --num:"SF Mono","JetBrains Mono","Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px}
body{background:var(--bg);color:var(--text);font-family:"Pretendard Variable",Pretendard,-apple-system,"Noto Sans KR",sans-serif;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:.95rem;outline:none}
input:focus,select:focus{border-color:var(--amber)}
input::placeholder{color:var(--faint)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
a{color:inherit}

header{display:flex;align-items:center;gap:14px;padding:16px 26px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-size:1.2rem;font-weight:800;letter-spacing:-.02em}
.logo em{font-style:normal;color:var(--amber)}
.spacer{flex:1}
.region-sel{padding:7px 10px;font-size:.85rem}
.key-btn{border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:.85rem;color:var(--sub)}
.key-btn:hover{color:var(--text);border-color:var(--sub)}
.key-btn.ok{border-color:var(--naver);color:var(--naver)}

main{max-width:1280px;margin:0 auto;padding:22px 26px 60px}

/* 검색 영역 */
.search-panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.search-row{display:flex;gap:10px;flex-wrap:wrap}
.search-row input[type=text]{flex:1;min-width:220px;font-size:1.05rem;padding:11px 14px}
.primary-btn{background:var(--amber);color:var(--amber-ink);font-weight:700;border-radius:8px;padding:10px 22px;font-size:.98rem}
.primary-btn:hover{filter:brightness(1.08)}
.primary-btn:disabled{opacity:.5;cursor:default}
.opt-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.opt-row select{padding:7px 10px;font-size:.85rem}
.opt-label{font-size:.78rem;color:var(--faint)}

/* 타 플랫폼 런처 */
.launcher{display:flex;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.launcher .lab{font-size:.78rem;color:var(--faint);margin-right:2px}
.launch-btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-size:.85rem;color:var(--sub);text-decoration:none}
.launch-btn:hover{color:var(--text);border-color:var(--sub)}
.launch-btn .dot{width:8px;height:8px;border-radius:50%}

/* 탭 & 카테고리 */
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{padding:9px 18px;border-radius:9px;font-size:.95rem;font-weight:600;color:var(--sub);border:1px solid transparent}
.tab:hover{color:var(--text)}
.tab.active{background:var(--panel2);color:var(--text);border-color:var(--line)}
.cat-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.cat-chip{padding:7px 14px;border-radius:99px;font-size:.85rem;color:var(--sub);border:1px solid var(--line)}
.cat-chip:hover{color:var(--text)}
.cat-chip.active{background:var(--amber);color:var(--amber-ink);border-color:var(--amber);font-weight:700}

/* 결과 툴바 */
.result-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.result-info{font-size:.85rem;color:var(--sub)}
.result-bar select{padding:6px 10px;font-size:.82rem}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{padding:6px 13px;font-size:.82rem;color:var(--sub)}
.seg button.active{background:var(--panel2);color:var(--text);font-weight:600}

/* 카드 그리드 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s}
.card:hover{border-color:#39404F}
.thumb{position:relative;aspect-ratio:16/9;background:var(--panel2);display:block}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(8,10,14,.85);font-family:var(--num);font-size:.72rem;padding:3px 7px;border-radius:5px}
.badge-shorts{position:absolute;left:8px;top:8px;background:var(--shorts);color:#1A0E02;font-size:.7rem;font-weight:800;padding:3px 8px;border-radius:5px}
.rank{position:absolute;left:8px;bottom:8px;font-family:var(--num);font-weight:700;font-size:.85rem;background:rgba(8,10,14,.85);color:var(--amber);padding:3px 9px;border-radius:5px}
.card-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:7px;flex:1}
.card-title{font-size:.92rem;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-decoration:none}
.card-title:hover{color:var(--amber)}
.card-ch{font-size:.8rem;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-stats{display:flex;align-items:baseline;gap:10px;margin-top:auto}
.card-views{font-family:var(--num);font-size:1.05rem;font-weight:700;color:var(--amber)}
.card-date{font-size:.76rem;color:var(--faint)}
.card-extra{font-family:var(--num);font-size:.74rem;color:var(--faint)}

.msg{border:1px dashed var(--line);border-radius:12px;padding:56px 20px;text-align:center;color:var(--sub);line-height:1.7}
.msg b{color:var(--text);display:block;font-size:1.05rem;margin-bottom:6px}
.load-more{display:block;margin:22px auto 0;border:1px solid var(--line);border-radius:9px;padding:11px 34px;font-size:.9rem;color:var(--sub)}
.load-more:hover{color:var(--text);border-color:var(--sub)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--faint);border-top-color:var(--amber);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}

/* 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(8,10,14,.75);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-bg.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;width:100%;max-width:500px}
.modal h3{font-size:1.05rem;margin-bottom:14px}
.modal input{width:100%}
.modal .hint{font-size:.8rem;color:var(--faint);line-height:1.65;margin-top:10px}
.modal .hint a{color:var(--amber)}
.modal .btn-row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.ghost-btn{border:1px solid var(--line);border-radius:8px;padding:9px 16px;font-size:.85rem;color:var(--sub)}
.ghost-btn:hover{color:var(--text)}
@media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>

<header>
  <div class="logo">콘텐츠 <em>탐색</em> 대시보드</div>
  <div class="spacer"></div>
  <select class="region-sel" id="regionSel">
    <option value="KR">🇰🇷 한국</option>
    <option value="US">🇺🇸 미국</option>
    <option value="CA">🇨🇦 캐나다</option>
    <option value="JP">🇯🇵 일본</option>
  </select>
  <button class="key-btn" id="btnApiKey">API 키 설정</button>
</header>

<main>
  <div class="search-panel">
    <div class="search-row">
      <input type="text" id="q" placeholder="검색어 입력 — 예: 두피관리, 보이차, 홈트레이닝" autocomplete="off">
      <button class="primary-btn" id="btnSearch">유튜브 검색</button>
    </div>
    <div class="opt-row">
      <span class="opt-label">업로드 기간</span>
      <select id="periodSel">
        <option value="1">최근 24시간</option>
        <option value="7" selected>최근 1주</option>
        <option value="30">최근 1개월</option>
        <option value="90">최근 3개월</option>
        <option value="365">최근 1년</option>
        <option value="0">전체 기간</option>
      </select>
      <span class="opt-label">정렬</span>
      <select id="orderSel">
        <option value="viewCount" selected>조회수순</option>
        <option value="date">최신순</option>
        <option value="relevance">관련성순</option>
      </select>
      <span class="opt-label">형식</span>
      <select id="typeSel">
        <option value="any" selected>전체</option>
        <option value="shorts">쇼츠만 (3분 이하)</option>
        <option value="long">롱폼만</option>
      </select>
    </div>
    <div class="launcher" id="launcher">
      <span class="lab">같은 검색어로 다른 플랫폼 열기 →</span>
      <a class="launch-btn" data-plat="tiktok" target="_blank" rel="noopener"><span class="dot" style="background:var(--tiktok)"></span>틱톡</a>
      <a class="launch-btn" data-plat="insta" target="_blank" rel="noopener"><span class="dot" style="background:var(--insta)"></span>인스타·릴스</a>
      <a class="launch-btn" data-plat="threads" target="_blank" rel="noopener"><span class="dot" style="background:var(--threads)"></span>쓰레드</a>
      <a class="launch-btn" data-plat="naver" target="_blank" rel="noopener"><span class="dot" style="background:var(--naver)"></span>네이버</a>
      <a class="launch-btn" data-plat="ttcc" target="_blank" rel="noopener"><span class="dot" style="background:var(--tiktok)"></span>틱톡 트렌드센터</a>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="trending">🔥 인기 급상승</button>
    <button class="tab" data-tab="search">🔍 검색 결과</button>
  </div>

  <div class="cat-row" id="catRow"></div>

  <div class="result-bar">
    <span class="result-info" id="resultInfo"></span>
    <div class="spacer" style="flex:1"></div>
    <span class="opt-label">결과 재정렬</span>
    <div class="seg" id="reSort">
      <button data-s="views" class="active">조회수</button>
      <button data-s="date">최신</button>
      <button data-s="like">좋아요</button>
      <button data-s="vph">시간당 조회수</button>
    </div>
  </div>

  <div class="grid" id="grid"></div>
  <div id="msgArea"></div>
  <button class="load-more" id="btnMore" hidden>더 보기</button>
</main>

<!-- API 키 모달 -->
<div class="modal-bg" id="apiModal">
  <div class="modal">
    <h3>YouTube Data API v3 키</h3>
    <input id="apiKeyInput" placeholder="AIza...">
    <div class="hint">
      1. <a href="https://console.cloud.google.com/apis/library/youtube.googleapis.com" target="_blank" rel="noopener">Google Cloud Console</a>에서 YouTube Data API v3 활성화<br>
      2. 사용자 인증 정보 → API 키 발급 → 여기에 붙여넣기<br>
      키는 이 브라우저의 localStorage에만 저장됩니다. 무료 할당량은 하루 10,000유닛
      (인기 급상승 조회 ≈ 1유닛, 키워드 검색 ≈ 100유닛 → 하루 약 100회 검색 가능).
    </div>
    <div class="btn-row">
      <button class="ghost-btn" data-close>취소</button>
      <button class="primary-btn" id="apiSave">저장</button>
    </div>
  </div>
</div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const KEY_API='ce_ytkey_v1';
let ytKey='';
try{ ytKey=localStorage.getItem(KEY_API)||''; }catch(e){}

const CATS=[
  {id:'',n:'전체'},{id:'26',n:'노하우·스타일'},{id:'22',n:'인물·블로그'},{id:'24',n:'엔터테인먼트'},
  {id:'10',n:'음악'},{id:'23',n:'코미디'},{id:'17',n:'스포츠'},{id:'20',n:'게임'},
  {id:'27',n:'교육'},{id:'28',n:'과학기술'},{id:'25',n:'뉴스·정치'},{id:'19',n:'여행'},
  {id:'15',n:'동물'},{id:'2',n:'자동차'},{id:'1',n:'영화·애니'}
];

let tab='trending', catId='', videos=[], nextToken=null, lastQuery='', reSortBy='views', loading=false;

/* ── 유틸 ── */
const fmt=n=>{ n=Number(n)||0;
  if(n>=1e8) return (n/1e8).toFixed(1).replace(/\.0$/,'')+'억';
  if(n>=1e4) return (n/1e4).toFixed(1).replace(/\.0$/,'')+'만';
  return n.toLocaleString('ko-KR'); };
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseDur(iso){ // PT1H2M3S → 초
  const m=/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(iso||''); if(!m) return 0;
  return (+m[1]||0)*3600+(+m[2]||0)*60+(+m[3]||0); }
const durTxt=s=>{ const h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;
  return (h?h+':':'')+(h?String(m).padStart(2,'0'):m)+':'+String(sec).padStart(2,'0'); };
const rel=iso=>{ const diff=(Date.now()-new Date(iso))/36e5;
  if(diff<1) return Math.max(1,Math.round(diff*60))+'분 전';
  if(diff<24) return Math.round(diff)+'시간 전';
  if(diff<24*30) return Math.round(diff/24)+'일 전';
  if(diff<24*365) return Math.round(diff/24/30)+'개월 전';
  return (diff/24/365).toFixed(1)+'년 전'; };
const hoursSince=iso=>Math.max(1,(Date.now()-new Date(iso))/36e5);

/* ── API ── */
async function api(path,params){
  if(!ytKey){ openKeyModal(); throw new Error('NOKEY'); }
  const u=new URL('https://www.googleapis.com/youtube/v3/'+path);
  Object.entries(params).forEach(([k,v])=>{ if(v!=null&&v!=='') u.searchParams.set(k,v); });
  u.searchParams.set('key',ytKey);
  const res=await fetch(u);
  if(!res.ok){
    let reason=''; try{ reason=(await res.json()).error?.errors?.[0]?.reason||''; }catch(e){}
    if(res.status===403&&reason==='quotaExceeded') throw new Error('오늘 API 할당량(10,000유닛)을 모두 사용했습니다. 내일 초기화됩니다.');
    if(res.status===400||res.status===403) throw new Error('API 키 오류입니다. 키와 YouTube Data API v3 활성화 여부를 확인해 주세요.');
    throw new Error('API 요청 실패 ('+res.status+')');
  }
  return res.json();
}
async function hydrate(ids){ // 조회수·길이 붙이기
  if(!ids.length) return [];
  const data=await api('videos',{part:'snippet,statistics,contentDetails',id:ids.join(','),maxResults:50});
  return (data.items||[]).map(v=>({
    id:v.id, title:v.snippet.title, ch:v.snippet.channelTitle,
    thumb:(v.snippet.thumbnails.medium||v.snippet.thumbnails.default||{}).url||'',
    pub:v.snippet.publishedAt, cat:v.snippet.categoryId,
    views:+v.statistics.viewCount||0, likes:+(v.statistics.likeCount||0),
    dur:parseDur(v.contentDetails.duration)
  }));
}

/* ── 로드 ── */
async function loadTrending(reset=true){
  if(loading) return; loading=true; showLoading(reset);
  try{
    const data=await api('videos',{
      part:'snippet,statistics,contentDetails', chart:'mostPopular',
      regionCode:$('#regionSel').value, videoCategoryId:catId||undefined,
      maxResults:24, pageToken:reset?undefined:nextToken });
    nextToken=data.nextPageToken||null;
    const batch=(data.items||[]).map(v=>({
      id:v.id,title:v.snippet.title,ch:v.snippet.channelTitle,
      thumb:(v.snippet.thumbnails.medium||{}).url||'',pub:v.snippet.publishedAt,
      views:+v.statistics.viewCount||0,likes:+(v.statistics.likeCount||0),
      dur:parseDur(v.contentDetails.duration)}));
    videos=reset?batch:videos.concat(batch);
    renderGrid(`인기 급상승 · ${$('#regionSel').selectedOptions[0].text.replace(/🇰🇷|🇺🇸|🇨🇦|🇯🇵/g,'').trim()} · ${CATS.find(c=>c.id===catId).n}`);
  }catch(err){ showError(err); }
  finally{ loading=false; }
}
async function loadSearch(reset=true){
  const q=$('#q').value.trim();
  if(!q){ $('#q').focus(); return; }
  if(loading) return; loading=true; lastQuery=q; showLoading(reset);
  try{
    const days=+$('#periodSel').value;
    const params={ part:'snippet', type:'video', q, maxResults:25,
      order:$('#orderSel').value, regionCode:$('#regionSel').value,
      relevanceLanguage:$('#regionSel').value==='KR'?'ko':undefined,
      videoCategoryId:catId||undefined,
      pageToken:reset?undefined:nextToken };
    if(days) params.publishedAfter=new Date(Date.now()-days*864e5).toISOString();
    const t=$('#typeSel').value;
    if(t==='shorts') params.videoDuration='short';       // 4분 미만
    if(t==='long') params.videoDuration='medium';        // 4~20분 (롱폼 근사)
    const data=await api('search',params);
    nextToken=data.nextPageToken||null;
    const ids=(data.items||[]).map(i=>i.id.videoId).filter(Boolean);
    let batch=await hydrate(ids);
    if(t==='shorts') batch=batch.filter(v=>v.dur<=180);
    videos=reset?batch:videos.concat(batch);
    renderGrid(`"${q}" 검색 결과 · ${$('#periodSel').selectedOptions[0].text}`);
  }catch(err){ showError(err); }
  finally{ loading=false; }
}

/* ── 렌더 ── */
function showLoading(reset){
  if(reset){ videos=[]; $('#grid').innerHTML=''; }
  $('#msgArea').innerHTML=`<div class="msg"><span class="spin"></span>불러오는 중…</div>`;
  $('#btnMore').hidden=true;
}
function showError(err){
  if(err.message==='NOKEY'){ $('#msgArea').innerHTML=`<div class="msg"><b>YouTube API 키가 필요합니다</b>우측 상단 "API 키 설정"에서 무료 키를 등록하면 바로 검색·탐색이 가능합니다.</div>`; return; }
  $('#msgArea').innerHTML=`<div class="msg"><b>오류가 발생했습니다</b>${esc(err.message)}</div>`;
}
function renderGrid(info){
  $('#msgArea').innerHTML='';
  let list=[...videos];
  const t=$('#typeSel').value;
  if(tab==='trending'){
    if(t==='shorts') list=list.filter(v=>v.dur<=180);
    if(t==='long') list=list.filter(v=>v.dur>180);
  }
  if(reSortBy==='views') list.sort((a,b)=>b.views-a.views);
  if(reSortBy==='date') list.sort((a,b)=>new Date(b.pub)-new Date(a.pub));
  if(reSortBy==='like') list.sort((a,b)=>b.likes-a.likes);
  if(reSortBy==='vph') list.sort((a,b)=>b.views/hoursSince(b.pub)-a.views/hoursSince(a.pub));

  $('#resultInfo').textContent=info+' · '+list.length+'개';
  if(!list.length){
    $('#msgArea').innerHTML=`<div class="msg"><b>결과가 없습니다</b>기간을 넓히거나 형식 필터를 바꿔보세요.</div>`;
    $('#btnMore').hidden=true; return;
  }
  $('#grid').innerHTML=list.map((v,i)=>`
    <div class="card">
      <a class="thumb" href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener">
        ${v.thumb?`<img src="${esc(v.thumb)}" alt="" loading="lazy">`:''}
        ${v.dur<=180?'<span class="badge-shorts">쇼츠</span>':''}
        <span class="rank">#${i+1}</span>
        <span class="dur">${durTxt(v.dur)}</span>
      </a>
      <div class="card-body">
        <a class="card-title" href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener">${esc(v.title)}</a>
        <div class="card-ch">${esc(v.ch)}</div>
        <div class="card-stats">
          <span class="card-views">${fmt(v.views)}</span>
          <span class="card-date">${rel(v.pub)}</span>
        </div>
        <div class="card-extra">👍 ${fmt(v.likes)} · 시간당 ${fmt(Math.round(v.views/hoursSince(v.pub)))}</div>
      </div>
    </div>`).join('');
  $('#btnMore').hidden=!nextToken;
}

/* ── 카테고리 칩 ── */
function renderCats(){
  $('#catRow').innerHTML=CATS.map(c=>
    `<button class="cat-chip ${catId===c.id?'active':''}" data-cat="${c.id}">${c.n}</button>`).join('');
}
$('#catRow').addEventListener('click',e=>{
  const b=e.target.closest('[data-cat]'); if(!b) return;
  catId=b.dataset.cat; renderCats();
  tab==='trending'?loadTrending():loadSearch();
});

/* ── 탭/검색/옵션 ── */
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  tab=t.dataset.tab;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));
  tab==='trending'?loadTrending():(lastQuery?loadSearch():$('#q').focus());
}));
$('#btnSearch').addEventListener('click',()=>{ switchToSearch(); loadSearch(); });
$('#q').addEventListener('keydown',e=>{ if(e.key==='Enter'){ switchToSearch(); loadSearch(); } });
function switchToSearch(){ tab='search';
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab==='search')); }
$('#regionSel').addEventListener('change',()=>tab==='trending'?loadTrending():lastQuery&&loadSearch());
$('#periodSel').addEventListener('change',()=>lastQuery&&tab==='search'&&loadSearch());
$('#orderSel').addEventListener('change',()=>lastQuery&&tab==='search'&&loadSearch());
$('#typeSel').addEventListener('change',()=>tab==='trending'?renderGrid($('#resultInfo').textContent.split(' · ').slice(0,-1).join(' · ')||'인기 급상승'):lastQuery&&loadSearch());
$('#btnMore').addEventListener('click',()=>tab==='trending'?loadTrending(false):loadSearch(false));
$('#reSort').addEventListener('click',e=>{
  const b=e.target.closest('[data-s]'); if(!b) return;
  reSortBy=b.dataset.s;
  document.querySelectorAll('#reSort button').forEach(x=>x.classList.toggle('active',x===b));
  renderGrid($('#resultInfo').textContent.replace(/ · \d+개$/,''));
});

/* ── 타 플랫폼 런처 ── */
function updateLauncher(){
  const q=encodeURIComponent($('#q').value.trim()||'');
  const links={
    tiktok:q?`https://www.tiktok.com/search?q=${q}`:'https://www.tiktok.com/explore',
    insta:q?`https://www.instagram.com/explore/search/keyword/?q=${q}`:'https://www.instagram.com/explore/',
    threads:q?`https://www.threads.com/search?q=${q}`:'https://www.threads.com/',
    naver:q?`https://search.naver.com/search.naver?where=video&query=${q}`:'https://naver.com',
    ttcc:'https://ads.tiktok.com/business/creativecenter/inspiration/popular/hashtag/pc/ko'
  };
  document.querySelectorAll('.launch-btn').forEach(a=>a.href=links[a.dataset.plat]);
}
$('#q').addEventListener('input',updateLauncher);

/* ── API 키 ── */
function openKeyModal(){ $('#apiKeyInput').value=ytKey; $('#apiModal').classList.add('open'); }
function refreshKeyBtn(){ const b=$('#btnApiKey');
  b.textContent=ytKey?'✓ API 키 등록됨':'API 키 설정'; b.classList.toggle('ok',!!ytKey); }
$('#btnApiKey').addEventListener('click',openKeyModal);
$('#apiSave').addEventListener('click',()=>{
  ytKey=$('#apiKeyInput').value.trim();
  try{ localStorage.setItem(KEY_API,ytKey); }catch(e){}
  $('#apiModal').classList.remove('open'); refreshKeyBtn();
  if(ytKey) loadTrending();
});
document.querySelectorAll('.modal-bg').forEach(bg=>bg.addEventListener('click',e=>{
  if(e.target===bg||e.target.hasAttribute('data-close')) bg.classList.remove('open'); }));
document.addEventListener('keydown',e=>{ if(e.key==='Escape') document.querySelectorAll('.modal-bg.open').forEach(m=>m.classList.remove('open')); });

/* ── 시작 ── */
renderCats(); updateLauncher(); refreshKeyBtn();
if(ytKey) loadTrending();
else $('#msgArea').innerHTML=`<div class="msg"><b>시작하기</b>우측 상단 "API 키 설정"에서 YouTube Data API 무료 키를 등록하면<br>인기 급상승 탐색과 키워드 검색이 바로 활성화됩니다.</div>`;
</script>
</body>
</html>
